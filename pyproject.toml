[project]
name = "ai-email-assistant"
version = "0.1.0"
description = "AI Email Assistant Agent - Create, refine, and organize professional email drafts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40,<2",
    "langchain-ollama>=0.2,<2",
    "langchain-openai>=0.2,<2",
    "langchain-anthropic>=0.2,<2",
    "httpx[http2]>=0.27,<1",
    "pillow>=11.3,<14",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "structlog>=24.0,<25",
    "bleach>=6.0,<7",
    "cryptography>=42.0,<43",
    "aiosmtplib>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "pre-commit>=3.8,<4",
    "types-requests>=2.31,<3",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".streamlit",
    "data",
    "assets",
]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "T201",  # print statements allowed in CLI
    "SIM103", # return boolean in if/else
    "SIM115", # use or/and instead of if/else
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["agent", "auth", "attachment_handler", "database", "email_composer", "email_reader", "email_sender", "email_tools", "prompts", "config", "log_config"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "streamlit*",
    "langchain*",
    "httpx*",
    "pillow*",
    "pydantic*",
    "structlog*",
    "bleach*",
    "cryptography*",
    "aiosmtplib*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::pytest.PytestConfigWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]